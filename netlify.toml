[build]
  # При каждой сборке обновляем списки новостей и товаров
  command = "node build-index.js"
  publish = "."

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Контент не кэшируем — чтобы изменения появлялись сразу
[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
