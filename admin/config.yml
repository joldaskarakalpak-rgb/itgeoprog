backend:
  name: git-gateway
  branch: main

# Папка для загружаемых файлов (фото товаров и т.п.)
media_folder: "images/uploads"
public_folder: "/images/uploads"

# Язык интерфейса панели
locale: 'ru'

collections:
  # ═══════════════════════════════════════════════════════
  #  НОВОСТИ
  # ═══════════════════════════════════════════════════════
  - name: "news"
    label: "Новости"
    label_singular: "Новость"
    folder: "content/news"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} — {{date}}"
    sortable_fields: ['date', 'title']
    fields:
      - { label: "Заголовок", name: "title", widget: "string" }
      - { label: "Дата", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Краткое описание", name: "summary", widget: "text", required: false,
          hint: "Одно-два предложения — показывается в списке новостей" }
      - { label: "Фото", name: "image", widget: "image", required: false,
          hint: "Необязательно. Картинка к новости" }
      - { label: "Текст новости", name: "body", widget: "markdown" }
      - { label: "Показывать на сайте", name: "published", widget: "boolean", default: true }

  # ═══════════════════════════════════════════════════════
  #  ТОВАРЫ И ЗАПЧАСТИ
  # ═══════════════════════════════════════════════════════
  - name: "products"
    label: "Товары и запчасти"
    label_singular: "Товар"
    folder: "content/products"
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — {{category}}"
    sortable_fields: ['title', 'category']
    fields:
      - { label: "Название товара", name: "title", widget: "string" }
      - label: "Категория"
        name: "category"
        widget: "select"
        options:
          - { label: "Для геофизики", value: "geo" }
          - { label: "Для электроники", value: "electronics" }
          - { label: "Под заказ", value: "order" }
      - { label: "Фото товара", name: "image", widget: "image", required: false,
          hint: "Загрузите фото товара" }
      - { label: "Дополнительные фото", name: "gallery", widget: "list", required: false,
          field: { label: "Фото", name: "photo", widget: "image" } }
      - { label: "Краткое описание", name: "summary", widget: "text",
          hint: "Показывается в карточке товара" }
      - { label: "Подробное описание", name: "body", widget: "markdown", required: false }
      - { label: "Цена", name: "price", widget: "string", required: false,
          hint: "Например: 500 000 сум или «по запросу»" }
      - { label: "В наличии", name: "in_stock", widget: "boolean", default: true }
      - { label: "Показывать на сайте", name: "published", widget: "boolean", default: true }

  # ═══════════════════════════════════════════════════════
  #  ПРОГРАММЫ (с файлами установки)
  # ═══════════════════════════════════════════════════════
  - name: "programs"
    label: "Программы"
    label_singular: "Программа"
    folder: "content/programs"
    create: true
    slug: "{{slug}}"
    summary: "{{title}} v{{version}}"
    fields:
      - { label: "Название программы", name: "title", widget: "string" }
      - { label: "Версия", name: "version", widget: "string",
          hint: "Например: 1.0 или 1.2.3" }
      - { label: "Иконка/скриншот", name: "image", widget: "image", required: false }
      - { label: "Краткое описание", name: "summary", widget: "text" }
      - { label: "Подробное описание", name: "body", widget: "markdown", required: false }
      - { label: "Файл установки", name: "setup_file", widget: "file", required: false,
          hint: "Загрузите установочный файл (.exe)" }
      - { label: "Возможности", name: "features", widget: "list", required: false,
          field: { label: "Возможность", name: "feature", widget: "string" } }
      - { label: "Показывать на сайте", name: "published", widget: "boolean", default: true }

  # ═══════════════════════════════════════════════════════
  #  НАСТРОЙКИ САЙТА
  # ═══════════════════════════════════════════════════════
  - name: "settings"
    label: "Настройки сайта"
    files:
      - name: "contacts"
        label: "Контакты"
        file: "content/settings/contacts.md"
        fields:
          - { label: "ФИО", name: "name", widget: "string" }
          - { label: "Должность", name: "role", widget: "string" }
          - { label: "Телефон", name: "phone", widget: "string" }
          - { label: "Telegram", name: "telegram", widget: "string", required: false }
          - { label: "Email", name: "email", widget: "string", required: false }
          - { label: "Город/регион", name: "location", widget: "string", required: false }

      - name: "update_info"
        label: "Обновление программы (version.json)"
        file: "content/settings/update.md"
        fields:
          - { label: "Текущая версия программы", name: "version", widget: "string",
              hint: "Эту версию проверяет программа Vulkan-SFP" }
          - { label: "Ссылка на установщик", name: "url", widget: "string",
              hint: "Например: https://itgeoprog.uz/downloads/VulkanSFP_Setup.exe" }
          - { label: "Что нового", name: "notes", widget: "text",
              hint: "Список изменений — покажется пользователю" }
