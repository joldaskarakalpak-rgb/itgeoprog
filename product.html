<!-- Просмотр фото на весь экран -->
<div id="lightbox" class="lightbox" role="dialog" aria-modal="true">
  <button class="lb-close" aria-label="Закрыть">&times;</button>
  <button class="lb-nav lb-prev" aria-label="Предыдущее">&lsaquo;</button>
  <img id="lb-img" src="" alt="">
  <button class="lb-nav lb-next" aria-label="Следующее">&rsaquo;</button>
  <div class="lb-counter" id="lb-counter"></div>
</div>

<script src="/assets/common.js"></script>
<script>
  (async () => {
   try {
    const params = new URLSearchParams(location.search);
    const n = params.get('n');
    const cat = params.get('cat') || '';

    // Ссылка назад — в свою категорию
    const backMap = { geo: '/goods-geo.html', electronics: '/goods-electronics.html', order: '/goods-order.html' };
    const back = document.getElementById('back-cat');
    if (back) back.href = backMap[cat] || '/goods.html';

    const items = await loadJson('content/products.json');
    // Берём товары нужной категории и находим по порядковому номеру
    const inCat = items.filter(p => p.published !== false && (!cat || p.category === cat));
    const prod = inCat[Number(n)] || null;
    const box = document.getElementById('prod-detail');
    if (!prod || !box) { if (box) box.innerHTML = '<p class="news-empty">Товар не найден.</p>'; return; }

    document.getElementById('prod-title').textContent = prod.title || '';
    document.title = (prod.title || 'Товар') + ' — ITGEOPROG';

    // Собираем все фото: основное + галерея
    const photos = [];
    if (prod.image) photos.push(fixPath(prod.image));
    if (Array.isArray(prod.gallery)) {
      prod.gallery.filter(Boolean).forEach(g => photos.push(fixPath(g)));
    }

    box.innerHTML = `
      <div class="pd-gallery">
        ${photos.length ? `
          <img class="pd-main" id="pd-main" src="${photos[0]}" alt="" data-idx="0" title="Нажмите для увеличения">
          ${photos.length > 1 ? `<div class="pd-thumbs">
            ${photos.map((src, i) => `<img class="pd-thumb${i === 0 ? ' active' : ''}" src="${src}" data-idx="${i}" alt="">`).join('')}
          </div>` : ''}
        ` : '<div class="pd-noimg">📦</div>'}
      </div>
      <div class="pd-info">
        ${prod.price ? `<div class="pd-price">${escapeHtml(prod.price)}</div>` : ''}
        <div class="pd-stock${prod.in_stock === false ? ' out' : ''}">
          ${prod.in_stock === false ? '✗ нет в наличии' : '✓ в наличии'}
        </div>
        ${prod.summary ? `<p class="pd-summary">${escapeHtml(prod.summary)}</p>` : ''}
        ${prod.body ? `<div class="pd-body">${mdToHtml(prod.body)}</div>` : ''}
        <div class="pd-actions">
          <a href="tel:+998907003038" class="btn btn-primary">✆ Заказать по телефону</a>
          <a href="https://t.me/+998907003038" class="btn btn-ghost">✈ Написать в Telegram</a>
        </div>
      </div>`;

    // ── Лайтбокс: увеличение фото ──
    const lb = document.getElementById('lightbox');
    const lbImg = document.getElementById('lb-img');
    const lbCounter = document.getElementById('lb-counter');
    let current = 0;

    function openLb(idx) {
      if (!photos.length) return;
      current = idx;
      lbImg.src = photos[current];
      lbCounter.textContent = photos.length > 1 ? `${current + 1} / ${photos.length}` : '';
      lb.classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeLb() {
      lb.classList.remove('open');
      document.body.style.overflow = '';
    }
    function move(step) {
      if (photos.length < 2) return;
      current = (current + step + photos.length) % photos.length;
      lbImg.src = photos[current];
      lbCounter.textContent = `${current + 1} / ${photos.length}`;
    }

    const main = document.getElementById('pd-main');
    if (main) main.addEventListener('click', (e) => {
      e.stopPropagation();
      openLb(Number(main.dataset.idx || 0));
    });

    document.querySelectorAll('.pd-thumb').forEach(t => {
      t.addEventListener('click', (e) => {
        e.stopPropagation();
        const i = Number(t.dataset.idx);
        if (main) { main.src = photos[i]; main.dataset.idx = i; }
        document.querySelectorAll('.pd-thumb').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
      });
    });

    lb.querySelector('.lb-close').addEventListener('click', closeLb);
    lb.querySelector('.lb-prev').addEventListener('click', e => { e.stopPropagation(); move(-1); });
    lb.querySelector('.lb-next').addEventListener('click', e => { e.stopPropagation(); move(1); });
    lbImg.addEventListener('click', e => e.stopPropagation());
    lb.addEventListener('click', e => { if (e.target === lb) closeLb(); });
    document.addEventListener('keydown', e => {
      if (!lb.classList.contains('open')) return;
      if (e.key === 'Escape') closeLb();
      if (e.key === 'ArrowLeft') move(-1);
      if (e.key === 'ArrowRight') move(1);
    });
   } catch (err) {
     console.error('Ошибка страницы товара:', err);
     const box = document.getElementById('prod-detail');
     if (box) box.innerHTML = '<p class="news-empty">Не удалось загрузить товар. Обновите страницу.</p>';
   }
  })();

  // Простой Markdown → HTML
  function mdToHtml(md) {
    const NL = String.fromCharCode(10);
    return String(md)
      .split(NL + NL)
      .filter(p => p.trim())
      .map(par => '<p>' + escapeHtml(par.trim()).split(NL).join('<br>') + '</p>')
      .join('');
  }
</script>
<script>
  if (window.netlifyIdentity) {
    window.netlifyIdentity.on('init', user => {
      if (!user) {
        window.netlifyIdentity.on('login', () => { document.location.href = '/admin/'; });
      }
    });
  }
</script>
